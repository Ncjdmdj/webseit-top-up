<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel</title>
<style>
:root{color-scheme:dark;--bg:#041634;--sf:#0b2550;--bd:#1b3a73;--tx:#eef3ff;--mu:#9db0d6;--gd:#f5c04a;--ok:#4ade80;--er:#ff7a7a;--on:#1a1200}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Noto Sans Khmer",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
header b{color:var(--gd);font-size:18px}header a{margin-left:auto;color:var(--mu)}
.tabs{display:flex;gap:6px;padding:10px 16px;overflow-x:auto}
.tabs button{background:var(--sf);color:var(--mu);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--gd);color:var(--on);font-weight:700;border-color:var(--gd)}
main{max-width:1000px;margin:0 auto;padding:6px 16px 60px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px}.k small{color:var(--mu)}.k div{font-size:24px;font-weight:700;color:var(--gd)}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--bd);border-radius:12px;margin-top:10px}
table{border-collapse:collapse;width:100%;min-width:640px}th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mu);font-weight:600;font-size:13px}
.st{padding:2px 8px;border-radius:8px;font-size:12px;background:#13305f}.st.success{color:var(--ok)}.st.failed{color:var(--er)}.st.review{color:var(--gd)}
button.a{background:var(--gd);color:var(--on);border:0;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;margin:2px 2px 2px 0}
button.a.r{background:var(--er)}button.a.g{background:var(--ok)}
input,select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.msg{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--sf);border:1px solid var(--bd)}.msg.er{color:var(--er)}.msg.ok{color:var(--ok)}
.muted{color:var(--mu)}
</style>
</head>
<body>
<header><b>⚙️ Admin</b><span id="who" class="muted"></span><a href="index.html">← ហាង</a></header>
<div class="tabs" id="tabs"></div>
<main id="app"></main>
<script>
// Backend URL (same as in your app.js). The admin token is read from the main site's login (same domain).
var API='https://webseit-top-up.onrender.com/api';
var TABS=[['ov','ទិដ្ឋភាពទូទៅ'],['or','បញ្ជាទិញ'],['us','អតិថិជន'],['dp','ការបញ្ចូលលុយ'],['pr','តម្លៃ']];
var tab='ov',orderFilter='review',note='';
var T=null;try{T=localStorage.getItem('gt')}catch(e){}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(n){return '$'+Number(n).toFixed(2)}
function dt(t){return t?new Date(t*1000).toLocaleString():''}
async function api(p,o){o=o||{};var h={'Content-Type':'application/json'};if(T)h.Authorization='Bearer '+T;
 var r=await fetch(API+p,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined});
 var d={};try{d=await r.json()}catch(e){}
 if(!r.ok){var e=new Error(d.error||('HTTP '+r.status));e.status=r.status;throw e}return d}
function setNote(t,ok){note='<div class="msg '+(ok?'ok':'er')+'">'+esc(t)+'</div>'}
function draw(html){document.getElementById('app').innerHTML=note+html;note=''}

async function load(){
 document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button data-t="'+t[0]+'" class="'+(tab==t[0]?'on':'')+'">'+t[1]+'</button>'}).join('');
 try{
  if(tab=='ov')await ov();else if(tab=='or')await orders();else if(tab=='us')await users();else if(tab=='dp')await deps();else await prices();
 }catch(e){
  if(e.status==401||!T)draw('<div class="msg er">សូមចូលគណនីជា Admin នៅទំព័រហាងសិន (<a href="index.html" style="color:var(--gd)">ចូលទីនោះ</a>) រួចត្រឡប់មកវិញ។</div>');
  else if(e.status==403)draw('<div class="msg er">គណនីនេះមិនមែន Admin ទេ។ ត្រូវដាក់ Telegram ID របស់អ្នកក្នុង <b>ADMIN_IDS</b> លើ Render។</div>');
  else draw('<div class="msg er">'+esc(e.message)+'</div>')}
}
async function ov(){
 var s=await api('/admin/stats');
 draw('<div class="cards"><div class="k"><small>បញ្ជាទិញជោគជ័យ</small><div>'+s.orders+'</div></div><div class="k"><small>ចំណូល</small><div>'+$(s.revenue)+'</div></div><div class="k"><small>ប្រាក់ចំណេញ</small><div>'+$(s.profit)+'</div></div><div class="k"><small>ត្រូវពិនិត្យ (review)</small><div style="color:'+(s.review?'var(--er)':'var(--ok)')+'">'+s.review+'</div></div></div>'+
 (s.review?'<p class="msg">មាន '+s.review+' បញ្ជាទិញកំពុងរង់ចាំអ្នក → ទៅផ្ទាំង <b>បញ្ជាទិញ</b>។</p>':''));
}
async function orders(){
 var d=await api('/admin/orders?status='+orderFilter);
 var f='<div class="row"><select id="of">'+[['review','ត្រូវពិនិត្យ'],['processing','កំពុងដំណើរការ'],['pending','រង់ចាំ'],['success','ជោគជ័យ'],['failed','បរាជ័យ'],['all','ទាំងអស់']].map(function(x){return '<option value="'+x[0]+'"'+(x[0]==orderFilter?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select></div>';
 var rows=d.orders.map(function(o){
  var act=(o.status=='review'||o.status=='processing')?'<button class="a g" data-o="'+o.id+'" data-a="success">✓ ជោគជ័យ</button><button class="a r" data-o="'+o.id+'" data-a="refund">↩ សងលុយ</button><button class="a" data-o="'+o.id+'" data-a="retry">⟳ ព្យាយាមម្តងទៀត</button>':'';
  return '<tr><td>#'+o.id+'<br><small class="muted">'+esc(dt(o.created))+'</small></td><td>'+esc(o.uname||'')+'<br><small class="muted">'+o.user_id+'</small></td><td>'+esc(o.game_name)+' · '+esc(o.pack_name)+'<br><small>ID: '+esc(o.player_id)+'</small></td><td>'+$(o.price)+'</td><td><span class="st '+esc(o.status)+'">'+esc(o.status)+'</span><br><small class="muted">'+esc(o.note||'')+(o.supplier_code?' · '+esc(o.supplier_code):'')+'</small></td><td>'+act+'</td></tr>'}).join('');
 draw(f+'<div class="tw"><table><tr><th>ID</th><th>អតិថិជន</th><th>កញ្ចប់</th><th>តម្លៃ</th><th>ស្ថានភាព</th><th></th></tr>'+(rows||'<tr><td colspan="6" class="muted">គ្មានបញ្ជាទិញ</td></tr>')+'</table></div>');
}
async function users(q){
 var d=await api('/admin/users'+(q?'?q='+encodeURIComponent(q):''));
 var rows=d.users.map(function(u){return '<tr><td>'+u.id+'</td><td>'+esc(u.name)+'</td><td>'+$(u.wallet)+'</td><td><button class="a" data-u="'+u.id+'">± លុយ</button></td></tr>'}).join('');
 draw('<div class="row"><input id="uq" placeholder="ស្វែងរកឈ្មោះ ឬ ID" value="'+esc(q||'')+'"><button class="a" id="us">ស្វែងរក</button></div><div class="tw"><table><tr><th>ID</th><th>ឈ្មោះ</th><th>កាបូប</th><th></th></tr>'+(rows||'<tr><td colspan="4" class="muted">គ្មាន</td></tr>')+'</table></div>');
}
async function deps(){
 var d=await api('/admin/deposits');
 var rows=d.deposits.map(function(x){return '<tr><td>'+esc(dt(x.created))+'</td><td>'+x.user_id+'</td><td>'+$(x.cents)+'</td><td><span class="st '+(x.status=='paid'?'success':'')+'">'+esc(x.status)+'</span></td><td><small class="muted">'+esc(x.txn)+'</small></td></tr>'}).join('');
 draw('<div class="tw"><table><tr><th>ពេលវេលា</th><th>User</th><th>ចំនួន</th><th>ស្ថានភាព</th><th>Txn</th></tr>'+(rows||'<tr><td colspan="5" class="muted">គ្មាន</td></tr>')+'</table></div>');
}
async function prices(){
 var d=await api('/admin/pricing');
 draw(d.games.map(function(g){return '<div class="k" style="margin-top:10px"><b>'+esc(g.emoji)+' '+esc(g.name)+'</b> <span class="row" style="display:inline-flex;margin:0 0 0 10px"><small class="muted">margin %</small><input type="number" step="0.1" min="0" max="500" value="'+g.margin+'" style="width:90px" id="m_'+esc(g.id)+'"><button class="a" data-m="'+esc(g.id)+'">រក្សាទុក</button></span>'+
  '<div class="tw"><table><tr><th>កញ្ចប់</th><th>តម្លៃដើម $</th><th>តម្លៃលក់</th><th></th></tr>'+g.packs.map(function(p,i){return '<tr><td>'+esc(p.name)+'</td><td><input type="number" step="0.01" min="0" value="'+p.cost+'" style="width:100px" id="c_'+esc(g.id)+'_'+i+'"></td><td>'+$(p.price)+'</td><td><button class="a" data-c="'+esc(g.id)+'" data-i="'+i+'">រក្សាទុក</button></td></tr>'}).join('')+'</table></div></div>'}).join(''));
}
async function run(fn,okmsg){try{await fn();setNote(okmsg,true)}catch(e){setNote(e.message,false)}load()}

document.addEventListener('click',function(ev){
 var b=ev.target.closest('button');if(!b)return;var D=b.dataset;
 if(D.t){tab=D.t;load()}
 else if(D.o){var lbl={success:'កំណត់ជាជោគជ័យ (អតិថិជនទទួលបាន diamonds ពិតហើយ?)',refund:'សងលុយចូលកាបូបអតិថិជន?',retry:'ផ្ញើទៅ supplier ម្តងទៀត? ប្រយ័ត្ន diamonds អាចចូលស្ទួន បើ supplier បានដំណើរការរួចហើយ។'}[D.a];
  if(confirm('#'+D.o+': '+lbl))run(function(){return api('/admin/orders/'+D.o+'/resolve',{method:'POST',body:{action:D.a}})},'រួចរាល់ #'+D.o)}
 else if(D.u){var a=prompt('ចំនួនលុយ USD (វិជ្ជមាន = បន្ថែម, អវិជ្ជមាន = ដក)','');if(a===null||!a.trim())return;var r=prompt('មូលហេតុ','')||'';
  run(function(){return api('/admin/users/'+D.u+'/wallet',{method:'POST',body:{amount:parseFloat(a),reason:r}})},'បានកែកាបូប user '+D.u)}
 else if(D.m){var v=parseFloat(document.getElementById('m_'+D.m).value);run(function(){return api('/admin/pricing',{method:'PUT',body:{game_id:D.m,margin:v}})},'បានរក្សាទុក margin')}
 else if(D.c){var cv=parseFloat(document.getElementById('c_'+D.c+'_'+D.i).value);run(function(){return api('/admin/pricing',{method:'PUT',body:{game_id:D.c,index:parseInt(D.i,10),cost:cv}})},'បានរក្សាទុកតម្លៃដើម')}
 else if(b.id=='us')users(document.getElementById('uq').value.trim());
});
document.addEventListener('change',function(ev){if(ev.target.id=='of'){orderFilter=ev.target.value;load()}});
load();
</script>
</body>
</html>
